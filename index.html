<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NILEX</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#078DE5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NILEX">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --white:#FFFFFF;--sky:#38BDF8;--blue:#078DE5;--navy:#102A56;
  --bg:#F1F9FE;--gray:#E8F0F7;--green:#16A765;--red:#E14848;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  transition: background-color .2s ease;
}
:root[data-theme="black"]{ --sky:#4B5563; --blue:#111827; --navy:#000000; --bg:#F5F5F5; --gray:#E5E5E5; }
:root[data-theme="red"]{ --sky:#FB7185; --blue:#E11D2E; --navy:#3B0A0E; --bg:#FFF1F2; --gray:#FCE1E3; }
:root[data-theme="navy"]{ --sky:#3B5D8C; --blue:#0B1F3F; --navy:#050D1A; --bg:#EEF2F8; --gray:#DCE3EE; }
:root[data-theme="gold"]{ --sky:#E8C766; --blue:#C9A227; --navy:#1A1400; --bg:#FFFBEF; --gray:#F3E8C7; }
:root[data-theme="pink"]{ --sky:#F9A8D4; --blue:#EC4899; --navy:#4A0F2C; --bg:#FFF0F7; --gray:#FBDCEC; }
:root[data-theme="maroon"]{ --sky:#B23A48; --blue:#7A1B2B; --navy:#2A0509; --bg:#FBF0F1; --gray:#F0DCDF; }
body{ transition: background-color .2s ease; }
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
*{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  height:100%;background:var(--navy);
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  display:flex;align-items:flex-start;justify-content:center;
  color:var(--navy);
}
#app{
  width:100%;max-width:420px;min-height:100vh;background:var(--bg);
  position:relative;overflow-x:hidden;display:flex;flex-direction:column;
  box-shadow:0 0 40px rgba(16,42,86,.3);
}
[dir="ltr"] .app-rtl-only{display:none}
*{ -webkit-tap-highlight-color: transparent; }
.screen{display:flex;flex-direction:column;min-height:100vh;padding-bottom:78px;animation:fade .18s cubic-bezier(.22,.61,.36,1);will-change:transform,opacity;}
@keyframes fade{from{opacity:0;transform:translateY(5px) translateZ(0)}to{opacity:1;transform:translateY(0) translateZ(0)}}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px;}
.back{width:36px;height:36px;border-radius:12px;background:var(--white);display:flex;align-items:center;justify-content:center;border:none;font-size:18px;color:var(--navy);cursor:pointer;box-shadow:0 2px 8px rgba(16,42,86,.08);}
.screen-title{font-size:17px;font-weight:700;color:var(--navy);}
.logo-mark{display:flex;align-items:center;gap:8px;justify-content:center;}
.logo-mark img{height:42px;}
.content{padding:14px 18px 24px;flex:1;}
h1,h2,h3{color:var(--navy);}
.btn{width:100%;padding:15px;border-radius:16px;border:none;background:var(--blue);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transform:translateZ(0) scale(1);transition:transform .08s cubic-bezier(.22,.61,.36,1);will-change:transform;}
.btn:active{transform:translateZ(0) scale(.97);}
.btn.secondary{background:var(--white);color:var(--blue);border:1px solid var(--sky);}
.btn.ghost{background:transparent;color:var(--blue);font-weight:600;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.card{background:var(--white);border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(16,42,86,.06);}
.receipt-card{width:100%;max-width:340px;margin:16px auto 0;padding:24px 22px;}
.receipt-divider{border-top:1.5px dashed var(--gray);margin:16px 0;}
.input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--gray);background:var(--white);font-size:15px;margin-top:8px;outline:none;color:var(--navy);font-weight:600;}
.input::placeholder{color:#8aa0ba;font-weight:400;}
.input:focus{border-color:var(--sky);}
.label{font-size:13px;color:#5a7290;font-weight:600;margin-top:14px;display:block;}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#fff;display:flex;border-top:1px solid var(--gray);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:20;}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;font-size:11px;color:#8aa0ba;cursor:pointer;font-weight:600;padding:4px 0;}
.navitem.active{color:var(--blue);}
.navitem .ic{font-size:20px;}
.balance-card{background:linear-gradient(135deg,var(--blue),var(--sky));border-radius:20px;padding:20px;color:#fff;}
.balance-amt{font-size:30px;font-weight:800;margin-top:6px;}
.quick-actions{display:flex;gap:10px;margin-top:14px;}
.qa{flex:1;background:#fff;border-radius:16px;padding:14px 6px;text-align:center;font-size:13px;font-weight:700;color:var(--navy);border:none;box-shadow:0 2px 10px rgba(16,42,86,.06);cursor:pointer;}
.qa .ic{font-size:22px;display:block;margin-bottom:6px;}
.nilex-card{background:linear-gradient(135deg,var(--navy),var(--blue) 70%,var(--sky));border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden;min-height:160px;display:flex;flex-direction:column;justify-content:space-between;}
.nilex-card small{opacity:.8;}
.nilex-card .num{font-size:19px;letter-spacing:2px;margin:14px 0;}
.tx{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--gray);cursor:pointer;}
.tx:last-child{border-bottom:none;}
.tx .ic{width:36px;height:36px;border-radius:10px;background:var(--gray);display:flex;align-items:center;justify-content:center;font-size:16px;margin-inline-end:10px;}
.tx-row{display:flex;align-items:center;}
.tx-amt.out{color:var(--red);font-weight:700;}
.tx-amt.in{color:var(--green);font-weight:700;}
.pinDots{display:flex;justify-content:center;gap:20px;margin:32px 0;}
.dot{width:24px;height:24px;border-radius:50%;border:3px solid var(--blue);transform:scale(1);transition:transform .1s cubic-bezier(.34,1.56,.64,1),background-color .1s cubic-bezier(.34,1.56,.64,1);will-change:transform;}
.dot.filled{background:var(--blue);transform:scale(1.2);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:340px;margin:0 auto;}
.key{aspect-ratio:1;border-radius:50%;border:none;background:#fff;font-size:28px;font-weight:700;color:var(--navy);box-shadow:0 2px 10px rgba(16,42,86,.08);cursor:pointer;transform:translateZ(0) scale(1);transition:transform .08s cubic-bezier(.22,.61,.36,1),box-shadow .08s ease-out;will-change:transform;}
.key:active{background:var(--gray);transform:translateZ(0) scale(.9);box-shadow:0 1px 4px rgba(16,42,86,.1);}
.methodopt{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:16px;margin-top:12px;cursor:pointer;border:2px solid transparent;}
.methodopt.sel{border-color:var(--sky);}
.methodopt .ic{font-size:24px;}
.chip{padding:9px 14px;border-radius:12px;background:var(--gray);border:none;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer;transform:translateZ(0) scale(1);transition:transform .08s cubic-bezier(.22,.61,.36,1),background-color .1s ease-out;will-change:transform;}
.chip:active{transform:translateZ(0) scale(.94);}
.chip.sel{background:var(--blue);color:#fff;}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.qrbox{background:var(--navy);border-radius:20px;padding:24px;text-align:center;color:#fff;}
.qrframe{width:200px;height:200px;margin:20px auto;border:3px solid var(--sky);border-radius:16px;position:relative;background:repeating-linear-gradient(45deg,#1a3763,#1a3763 6px,#173058 6px,#173058 12px);}
.result-ic{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;margin:20px auto;}
.center{text-align:center;}
.settingsrow{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:15px 16px;border-radius:14px;margin-top:10px;cursor:pointer;font-weight:600;}
.notif{background:#fff;border-radius:14px;padding:14px;margin-top:10px;display:flex;gap:10px;align-items:flex-start;}
.notif .ic{font-size:20px;}
.small{font-size:12px;color:#7c93ac;}
.waves{height:120px;background:linear-gradient(180deg,transparent,var(--bg));position:relative;}
.langbtn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px;border-radius:16px;border:1px solid var(--gray);background:#fff;margin-top:12px;font-size:15px;font-weight:700;cursor:pointer;color:var(--navy);}
.langbtn.sel{border-color:var(--sky);background:var(--sky);color:#fff;}
.err{color:var(--red);font-size:13px;margin-top:8px;font-weight:600;min-height:16px;}
.filterrow{display:flex;gap:8px;margin-top:12px;overflow-x:auto;}
.home-content{color:#000;}
.home-content .tx-amt.in{color:var(--green);}
.home-content .tx-amt.out{color:var(--red);}
.card3d-wrap{perspective:900px;}
.nilex-card.home3d{
  transform-style:preserve-3d;
  transition:transform .15s ease-out;
  will-change:transform;
  animation:cardFloat 6s ease-in-out infinite;
  box-shadow:0 18px 34px rgba(16,42,86,.28);
}
.nilex-card.home3d::after{
  content:"";
  position:absolute; inset:0; border-radius:20px;
  background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.4) 42%,transparent 58%);
  background-size:220% 220%;
  animation:cardShine 3.4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes cardFloat{
  0%,100%{ transform:rotateX(8deg) rotateY(-12deg) translateY(0); }
  50%{ transform:rotateX(-4deg) rotateY(10deg) translateY(-6px); }
}
@keyframes cardShine{
  0%{ background-position:-160% -160%; }
  55%,100%{ background-position:160% 160%; }
}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--white);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(16,42,86,.08);overflow:hidden;flex-shrink:0;}
.brand-mark img{height:20px;width:auto;}
.card-logo-chip{display:inline-flex;align-items:center;justify-content:center;background:var(--white);border-radius:9px;padding:4px 7px;box-shadow:0 2px 6px rgba(0,0,0,.15);}
.card-logo-chip img{height:16px;width:auto;display:block;}
.tap-illustration{display:flex;justify-content:center;margin-top:10px;}
.tap-pulse{animation:tapPulse 1.4s ease-in-out infinite;transform-origin:130px 70px;}
@keyframes tapPulse{0%,100%{opacity:.35;}50%{opacity:1;}}
.lg-wrap{width:100%;display:flex;justify-content:center;align-items:center;min-height:70vh;}
.lg-stage{position:relative;width:min(88vw,400px);aspect-ratio:911/663;}
.lg-stage img{display:block;width:100%;height:100%;}
.lg-glow{position:absolute;left:50%;top:32%;width:75%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.38),rgba(56,189,248,0) 65%);opacity:0;animation:lgGlow 2.4s cubic-bezier(.22,.61,.36,1) .1s both;}
.lg-sym{position:absolute;overflow:hidden;transform-origin:50% 60%;-webkit-mask-image:linear-gradient(100deg,#000 45%,transparent 55%);mask-image:linear-gradient(100deg,#000 45%,transparent 55%);-webkit-mask-size:260% 100%;mask-size:260% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;animation:lgSym 1.25s cubic-bezier(.16,1,.3,1) both,lgWipe 1.2s cubic-bezier(.4,0,.2,1) both;}
.lg-shine{position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.9) 50%,rgba(255,255,255,0) 65%);transform:translateX(-130%);animation:lgShine 1.1s ease-in-out 1.05s both;}
.lg-l{position:absolute;opacity:0;transform:translateY(16px) translateZ(0);filter:blur(6px);animation:lgLetter .7s cubic-bezier(.16,1,.3,1) both;will-change:transform,opacity,filter;}
.lg-tag{position:absolute;clip-path:inset(0 50% 0 50%);opacity:0;animation:lgTag .9s cubic-bezier(.4,0,.2,1) 2.55s both;}
@keyframes lgSym{0%{opacity:0;transform:translateY(18px) scale(.88) translateZ(0);filter:blur(8px);}100%{opacity:1;transform:translateY(0) scale(1) translateZ(0);filter:blur(0);}}
@keyframes lgWipe{0%{-webkit-mask-position:100% 0;mask-position:100% 0;}100%{-webkit-mask-position:0 0;mask-position:0 0;}}
@keyframes lgShine{0%{transform:translateX(-130%);}100%{transform:translateX(130%);}}
@keyframes lgLetter{0%{opacity:0;transform:translateY(16px) translateZ(0);filter:blur(6px);}100%{opacity:1;transform:translateY(0) translateZ(0);filter:blur(0);}}
@keyframes lgTag{0%{opacity:0;clip-path:inset(0 50% 0 50%);}100%{opacity:1;clip-path:inset(0 0 0 0);}}
@keyframes lgGlow{0%{opacity:0;transform:translate(-50%,-50%) scale(.7);}40%{opacity:1;}100%{opacity:.35;transform:translate(-50%,-50%) scale(1.15);}}
.demoflag{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:10px;padding:4px 10px;border-radius:20px;z-index:30;opacity:.85;}
</style>
</head>

function merchantStats(){
  const today = new Date().toISOString().slice(0,10);
  const list = S.merchantTx.filter(x=>x.date.slice(0,10)===today);
  const success = list.filter(x=>x.status==='success');
  const total = success.reduce((s,x)=>s+x.amt,0);
  return { total, successCount:success.length, pendingCount:list.filter(x=>x.status==='pending').length, failedCount:list.filter(x=>x.status==='failed').length };
}
function merchantReportData(){
  const now = Date.now();
  const successTx = S.merchantTx.filter(x=>x.status==='success');
  const inRange = (tx,days)=> (now - new Date(tx.date.replace(' ','T')).getTime()) <= days*86400000;
  const today = successTx.filter(x=>inRange(x,1)).reduce((s,x)=>s+x.amt,0);
  const week = successTx.filter(x=>inRange(x,7)).reduce((s,x)=>s+x.amt,0);
  const month = successTx.filter(x=>inRange(x,30)).reduce((s,x)=>s+x.amt,0);
  const count = successTx.length;
  const avg = count? Math.round(successTx.reduce((s,x)=>s+x.amt,0)/count) : 0;
  return {today, week, month, count, avg};
}

function row(l,v){ return `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--gray);"><span class="small">${l}</span><strong>${v}</strong></div>`; }
function receiptRows(tx){
  const parts = (tx.date||"").split(" ");
  const d = parts[0]||"—", tm = parts[1]||"—";
  const methodTxt = tx.type==='recv' ? '—' : tx.type==='tap' ? t('tapPay') : tx.type==='send' ? t('send') : t('digitalCard');
  const acctRow = tx.recipientMethod==='account' ? row(t("nilexAccount"), tx.recipientId||"—") : "";
  return `
    ${row(t("date"), d)}
    ${row(t("time"), tm)}
    ${row(t("method"), methodTxt)}
    ${acctRow}
    ${row(t("ref"), "NLX-"+String(tx.id).padStart(6,"0")+"-DEMO")}
    ${row(t("fee"), t("noFee"))}
    ${row(t("status"), `<span style="color:var(--green);font-weight:700;">${t("success")}</span>`)}
  `;
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawReceiptBlob(tx){
  return new Promise((resolve)=>{
    const rows = [
      [t('date'), (tx.date||'').split(' ')[0]||'—'],
      [t('time'), (tx.date||'').split(' ')[1]||'—'],
      [t('method'), tx.type==='recv'?'—':tx.type==='tap'?t('tapPay'):tx.type==='send'?t('send'):t('digitalCard')]
    ];
    if(tx.recipientMethod==='account') rows.push([t('nilexAccount'), tx.recipientId||'—']);
    rows.push([t('ref'), 'NLX-'+String(tx.id).padStart(6,'0')+'-DEMO']);
    rows.push([t('fee'), t('noFee')]);
    rows.push([t('status'), t('success')]);
    const rowH = 32, W = 380;
    const H = 300 + rows.length*rowH;
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = W*scale; canvas.height = H*scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale,scale);
    ctx.fillStyle = '#F1F9FE'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#fff'; roundRectPath(ctx,14,14,W-28,H-28,20); ctx.fill();
    const img = new Image();
    const finish = ()=>{
      let y = 46;
      if(img.complete && img.naturalWidth){
        const w=64, h2=64*(img.naturalHeight/img.naturalWidth);
        ctx.drawImage(img, W/2-w/2, y, w, h2);
        y += h2 + 18;
      } else { y += 8; }
      ctx.textAlign='center'; ctx.fillStyle='#102A56'; ctx.font='bold 15px Tahoma, Arial';
      ctx.fillText(t('receiptTitle'), W/2, y); y+=36;
      ctx.beginPath(); ctx.fillStyle='#16A765'; ctx.arc(W/2, y+18, 24, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 22px Arial'; ctx.fillText('\u2713', W/2, y+26); y+=62;
      ctx.fillStyle='#102A56'; ctx.font='bold 28px Tahoma, Arial';
      ctx.fillText((tx.amt<0?'-':'+')+fmt(Math.abs(tx.amt))+' SDG', W/2, y); y+=34;
      ctx.font='14px Tahoma, Arial'; ctx.fillStyle='#5a7290';
      ctx.fillText(txTitle(tx), W/2, y); y+=22;
      ctx.strokeStyle='#E8F0F7'; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(28,y); ctx.lineTo(W-28,y); ctx.stroke(); ctx.setLineDash([]); y+=26;
      const rtl = S.lang==='ar';
      rows.forEach(([label,val])=>{
        ctx.font='13px Tahoma, Arial'; ctx.fillStyle='#5a7290';
        ctx.textAlign = rtl?'right':'left';
        ctx.fillText(label, rtl?(W-28):28, y);
        ctx.font='bold 13px Tahoma, Arial'; ctx.fillStyle='#102A56';
        ctx.textAlign = rtl?'left':'right';
        ctx.fillText(String(val), rtl?28:(W-28), y);
        y+=rowH;
      });
      y+=6;
      ctx.textAlign='center'; ctx.font='11px Tahoma, Arial'; ctx.fillStyle='#8aa0ba';
      ctx.fillText(t('demoNote'), W/2, y);
      canvas.toBlob(b=>resolve(b), 'image/png');
    };
    img.onload = finish; img.onerror = finish;
    img.src = LOGO;
  });
}
async function downloadReceipt(txId){
  const tx = S.transactions.find(x=>x.id===txId) || S.transactions[0];
  if(!tx) return;
  try{
    if(!window.claude || !window.claude.use){ alert(t('downloadUnavailable')); return; }
    const dl = await window.claude.use('downloads');
    if(!dl){ alert(t('downloadUnavailable')); return; }
    const blob = await drawReceiptBlob(tx);
    await dl.save({ filename: 'NILEX-Receipt-'+tx.id+'.png', data: blob });
  }catch(e){

function pinPress(k){
  if(S.txLock) return;
  if(k==='back'){ set({pin:S.pin.slice(0,-1), pinErr:false}); return; }
  if(S.pin.length>=4) return;
  const pin = S.pin+k;
  set({pin, pinErr:false});
  if(pin.length===4){
    setTimeout(()=>{
      if(pin!=="1234"){ set({pinErr:true, pin:""}); return; }
      if(S.pinContext==='unlock'){ set({pin:'', pinErr:false, pinContext:'payment'}); go('home'); return; }
      S.txLock = true;
      go("processing");

    }, 200);

function runResult(){
  const method = S.payMethod;
  const fail = S.flowResult==="fail";
  if(!fail){
    let type, title, titleEn;
    if(method==="send"){ type="send"; title="تحويل إلى "+(S.sendTo||"مستخدم"); titleEn="Transfer to "+(S.sendTo||"user"); }
    else if(method==="tap"){ type="tap"; title="الدفع بالتقريب إلى "+T.ar.tapRecipient; titleEn="Tap Pay to "+T.en.tapRecipient; }
    else { type="pay"; title="دفع إلى متجر النيل"; titleEn="Payment to Nile Store"; }
    const tx = { id: Date.now(), type, title, titleEn,
      amt: -Math.abs(S.payAmount), date: new Date().toISOString().slice(0,16).replace("T"," "), status:"success",
      recipientMethod: method==="send" ? S.sendMethod : null, recipientId: method==="send" ? S.sendTo : null };
    S.transactions.unshift(tx);
    S.balance -= Math.abs(S.payAmount);
    playChime();
    go("success");
  } else {
    go("fail");
  }
  set({flowResult:null, pin:"", tapStatus:"idle"});
}

let audioCtx = null;
function initAudio(){
  try{
    if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    if(audioCtx.state!=='running'){ audioCtx.resume().catch(()=>{}); }
  }catch(e){ audioCtx = null; }
}
async function playChime(){
  if(!S.soundOn) return;
  try{
    initAudio();
    if(!audioCtx) return;
    if(audioCtx.state!=='running'){ await audioCtx.resume().catch(()=>{}); }
    if(audioCtx.state!=='running') return;
    const t0 = audioCtx.currentTime + 0.02;
    [[1046.5, t0, 0.13],[1568, t0+0.09, 0.26]].forEach(([freq,start,dur])=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.28, start+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start+dur+0.03);
    });
  }catch(e){}
}
['click','touchend','keydown','pointerdown'].forEach(ev=>{
  document.addEventListener(ev, initAudio, {passive:true});
});

function pwStrengthText(pw){
  if(!pw) return '';
  let score=0;
  if(pw.length>=8) score++;
  if(/[A-Z]/.test(pw)) score++;
  if(/[0-9]/.test(pw)) score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;
  const labels = S.lang==='ar' ? ['ضعيفة','متوسطة','جيدة','قوية'] : ['Weak','Fair','Good','Strong'];
  return (S.lang==='ar'?'قوة كلمة المرور: ':'Password strength: ') + labels[Math.max(0,score-1)];
}

  const el = document.getElementById('regPassword');
  const out = document.getElementById('pwStrength');

function bindCardTilt(){
  const wrap = document.getElementById('homeCard3d');
  if(!wrap) return;
  const card = wrap.querySelector('.nilex-card');
  function handleMove(x,y){
    const rect = wrap.getBoundingClientRect();
    const px = (x-rect.left)/rect.width, py = (y-rect.top)/rect.height;
    const rx = (0.5-py)*16, ry = (px-0.5)*20;
    card.style.animation = 'none';
    card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) translateY(-3px)`;
  }
  function reset(){ card.style.animation = ''; card.style.transform = ''; }
  wrap.addEventListener('mousemove', e=>handleMove(e.clientX,e.clientY));
  wrap.addEventListener('mouseleave', reset);
  wrap.addEventListener('touchmove', e=>{ const t=e.touches[0]; if(t) handleMove(t.clientX,t.clientY); }, {passive:true});
  wrap.addEventListener('touchend', reset);
}

  }
}
